<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：项目 → VibeGate 三项检查 → 双语判定">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" fill="#F5F5F7"/>
  <!-- base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="160" x2="335" y2="160" marker-end="url(#ah-l)"/>
    <line x1="540" y1="160" x2="665" y2="160" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching dash data flow (dasharray 6 10 = 16; from 32 -> 0 = 2 periods, seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="160" x2="331" y2="160" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="540" y1="160" x2="661" y2="160" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- animateMotion packet dots -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M210,160 L331,160" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M540,160 L661,160" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- nodes: breathing fill-opacity 0.10 <-> 0.18, staggered -->
  <g>
    <rect x="40" y="120" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="153" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Project 项目</text>
    <text x="125" y="175" text-anchor="middle" font-size="11" fill="#6E6E73">vibe-coded 应用</text>

    <rect x="340" y="120" width="200" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="153" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">VibeGate</text>
    <text x="440" y="175" text-anchor="middle" font-size="10.5" fill="#6E6E73">readiness · license · clean-run</text>

    <rect x="670" y="120" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="153" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Verdict 判定</text>
    <text x="755" y="175" text-anchor="middle" font-size="11" fill="#6E6E73">zh+en · 绿 / 黄 / 红</text>
  </g>
</svg>
