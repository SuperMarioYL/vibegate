-size="30" text-anchor="start" font-weight="400">Supported input and output routes</text><ellipse cx="500" cy="337" rx="238" ry="176" fill="none" stroke="#dacbf7"/><ellipse cx="500" cy="337" rx="193" ry="144" fill="none" stroke="#dacbf7" stroke-dasharray="2 9"/><circle cx="500" cy="337" r="68" fill="#f9f7fe" stroke="#8054df"/><text x="500" y="348" fill="#8054df" font-size="34" text-anchor="middle" font-weight="700">VI</text><path d="M276 211H390V337H432" fill="none" stroke="#8054df" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 211H390V337H432" class="flow" fill="none" stroke="#6a6d98" stroke-width="2"/><rect x="40" y="156" width="236" height="112" rx="12" fill="#f9f7fe" stroke="#dacbf7"/><text x="58" y="187.0" fill="#191630" font-size="21" text-anchor="start" font-weight="400">Node / Bun</text><text x="58" y="216.4" fill="#191630" font-size="21" text-anchor="start" font-weight="400">manifests</text><text x="58" y="239.0" fill="#5e5e88" font-size="17" text-anchor="start" font-weight="400">Runtime and startup</text><text x="58" y="262.8" fill="#5e5e88" font-size="17" text-anchor="start" font-weight="400">detection</text><path d="M568 337H662V211H724" fill="none" stroke="#8054df" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M568 337H662V211H724" class="flow" fill="none" stroke="#6a6d98" stroke-width="2"/><rect x="724" y="156" width="236" height="112" rx="12" fill="#f9f7fe" stroke="#dacbf7"/><text x="742" y="187.0" fill="#191630" font-size="21" text-anchor="start" font-weight="400">Mini-program</text><text x="742" y="216.4" fill="#191630" font-size="21" text-anchor="start" font-weight="400">markers</text><text x="742" y="239.0" fill="#5e5e88" font-size="17" text-anchor="start" font-weight="400">Static checks;</text><text x="742" y="262.8" fill="#5e5e88" font-size="17" text-anchor="start" font-weight="400">startup skipped</text><path d="M276 357H390V337H432" fill="none" stroke="#8054df" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 357